# Misconception bank (owner: B). IDs follow matheasy/diagnosis/ids.py:
#   rule:<MalruleLib name>   runnable; the rule lives in matheasy/diagnosis/rules/
#   eedi:<MisconceptionId>   known only as text
#   slip                     a careless mistake; always a suspect
#
# A twin (same wrong answer on every problem) has no entry of its own: its
# rule's entry stands for it. See twins= in matheasy/diagnosis/rules/.
#
# `eedi` lists the Eedi MisconceptionIds a rule matches, closest first; the first
# one labels the rule's training pairs (shortlister/rule_pairs.py). An empty list
# means no Eedi misconception describes the same mistake.
# Held-back rules (eval/held_back_rules.json) must never appear here.
#
# Rules are added module by module; see docs/diagnosis_rules.md.

misconceptions:
  rule:fractions.add_numerators_denominators:
    text: Adds the numerators and adds the denominators, e.g. 1/2 + 1/3 = 2/5.
    eedi: [217]

  rule:fractions.keep_common_denominator_for_multiplication:
    text: Keeps the shared denominator when multiplying fractions, e.g. 2/5 × 3/5 = 6/5.
    eedi: []

  rule:fractions.multiply_across_for_division:
    text: Divides fractions by multiplying straight across without flipping the divisor, e.g. 2/3 ÷ 4/5 = 8/15.
    eedi: [1804]

  rule:fractions.ignore_denominators:
    text: Works on the numerators only and ignores the denominators, e.g. 2/3 + 1/5 = 3.
    eedi: []

  rule:fractions.natural_number_bias_numerator_only:
    text: Compares fractions by their numerators only, e.g. 3/4 < 5/8 because 3 < 5.
    eedi: [684]

  rule:ratios_proportions.additive_instead_of_multiplicative:
    text: Keeps the difference between quantities instead of the ratio, e.g. 2/3 = 6/x gives x = 7.
    eedi: [1866]

  rule:ratios_proportions.swap_ratios_or_units:
    text: Sets one ratio of a proportion up the wrong way round, e.g. 2/3 = 6/x solved as 3/2 = 6/x, so x = 4.
    eedi: []

  rule:decimals.ignore_decimal_point:
    text: Drops the decimal points and works with whole numbers, e.g. 0.3 × 0.2 = 6.
    eedi: [189, 2055, 1619, 1898]

  rule:decimals.whole_number_thinking:
    text: Treats decimals as whole numbers, e.g. 0.5 + 0.25 = 30, and 0.45 > 0.8 because 45 > 8.
    eedi: [2323]

  rule:decimals.longer_is_larger:
    text: Thinks a decimal with more digits is larger, e.g. 0.45 > 0.8.
    eedi: [2237]

  rule:percentages.percent_equals_decimal:
    text: Treats a percentage as the plain number, e.g. 25% = 25, so 25% of 80 = 2000.
    eedi: [1756]

  rule:multiplication_division.division_makes_smaller:
    text: Expects division to make a number smaller, so multiplies instead, e.g. 4 ÷ 0.5 = 2.
    eedi: []

  rule:multiplication_division.divide_larger_by_smaller_always:
    text: Always divides the larger number by the smaller, e.g. 4 ÷ 6 = 1.5.
    eedi: [2359]

  rule:multiplication_division.multiplication_makes_bigger:
    text: Expects multiplication to make a number bigger, so adds instead, e.g. 0.5 × 4 = 4.5.
    eedi: [175]

  rule:negative_numbers.larger_absolute_value_always_wins:
    text: Gives the answer the sign of the number with the larger size, e.g. 3 × -2 = 6 and 5 - 8 = 3.
    eedi: [974, 941]

  rule:negative_numbers.negative_times_negative_negative:
    text: Thinks a negative times a negative is negative, e.g. (-2) × (-3) = -6.
    eedi: [1597]

  rule:order_of_operations.strict_left_to_right:
    text: Works strictly from left to right, ignoring precedence, e.g. 2 + 3 × 4 = 20.
    eedi: [1005, 1507]

  rule:order_of_operations.ignore_parentheses:
    text: Ignores brackets and works from left to right, e.g. 2 × (3 + 4) = 10.
    eedi: [2488]

  rule:order_of_operations.addition_before_subtraction_always:
    text: Always adds before subtracting, e.g. 10 - 3 + 2 = 5.
    eedi: [2181, 2306]

  rule:order_of_operations.multiplication_before_division_always:
    text: Always multiplies before dividing, e.g. 6 ÷ 2 × 3 = 1.
    eedi: [2306]

  rule:order_of_operations.pemdas_strictly_sequential:
    text: Treats PEMDAS as separate steps (× then ÷ then + then −), e.g. 12 ÷ 2 × 3 = 2.
    eedi: [2306]

  rule:algebra.cancel_across_equals:
    text: Cancels letter terms across the equals sign as if they were factors, e.g. 5x = 2x + 12 gives x = 12/5.
    eedi: []

  rule:algebra.divide_one_term_only:
    text: Divides only the letter term, not the whole side, e.g. 2x + 4 = 10 becomes x + 4 = 5.
    eedi: [170]

  rule:algebra.variable_letter_has_value:
    text: Thinks a letter stands for a fixed number, such as its place in the alphabet, e.g. x + 5 = 12 gives x = 10.
    eedi: []

  rule:algebra.distribute_over_non_distributive:
    text: Squares a bracket term by term, e.g. (x + 3)^2 = x^2 + 9.
    eedi: [729]

  # Our own rules (no MalruleLib counterpart; to-do T2). Groups brackets. and like_terms.
  rule:brackets.multiply_first_term_only:
    text: Multiplies only the first term inside the bracket, e.g. 2(x + 3) = 2x + 3.
    eedi: [220]

  rule:brackets.minus_first_term_only:
    text: Changes the sign of only the first term after a minus in front of a bracket, e.g. -(x + 1) = -x + 1.
    eedi: [583]

  rule:brackets.negative_multiplier_first_term_only:
    text: Multiplies by the size of a negative number but gives its sign only to the first term, e.g. -2(x - 3) = -2x - 6.
    eedi: []

  rule:like_terms.add_letters_as_powers:
    text: Adds like terms by multiplying the letters, e.g. x + x = x^2 and 2x + 3x = 5x^2.
    eedi: [1644]

  rule:like_terms.combine_unlike_terms:
    text: Adds terms that are not alike, e.g. 3x + 2 = 5x and 4a + 3b = 7ab.
    eedi: [2422, 436]

  rule:exponents.multiply_base_by_exponent:
    text: Multiplies the base by the exponent, e.g. 2^3 = 6.
    eedi: [1072, 438]

  rule:exponents.zero_exponent_equals_zero:
    text: Thinks anything to the power 0 is 0, e.g. 5^0 = 0.
    eedi: [1920]

  rule:exponents.negative_exponent_makes_negative:
    text: Thinks a negative exponent makes the answer negative, e.g. 2^-2 = -4.
    eedi: [433]

  rule:exponents.multiply_exponents_when_multiplying_powers:
    text: Multiplies the exponents when multiplying powers, e.g. x^3 × x^5 = x^15.
    eedi: [2582, 1085]

  rule:exponents.add_exponents_for_power_of_power:
    text: Adds the exponents for a power of a power, e.g. (x^2)^3 = x^5.
    eedi: [1885]

  rule:exponents.forget_exponent_on_coefficient:
    text: Raises the letters but not the number in front, e.g. (2x^3)^2 = 2x^6.
    eedi: []

  rule:exponents.distribute_exponent_over_addition:
    text: Raises each term of a sum separately, e.g. (2 + 3)^2 = 13.
    eedi: [729]

  rule:buggy_addition.add_all_digits:
    text: Adds every digit regardless of place value, e.g. 23 + 45 = 14.
    eedi: []

  rule:buggy_addition.forget_carry:
    text: Forgets to add the carried digit, e.g. 47 + 38 = 75.
    eedi: []

  rule:buggy_addition.carry_adds_to_same_column:
    text: Adds the carry into the same column instead of the next, e.g. 37 + 25 = 53.
    eedi: [1383]

  rule:buggy_addition.carry_not_reset:
    text: Never resets the carry, adding it into every later column, e.g. 328 + 917 = 1345.
    eedi: []

  rule:buggy_addition.left_justify:
    text: Lines numbers up on the left instead of the right, e.g. 8 + 12 = 92.
    eedi: [285, 980]

  rule:buggy_addition.single_digit_linked:
    text: Writes a single digit next to the other number instead of adding, e.g. 8 + 12 = 128.
    eedi: [1332]

  rule:buggy_addition.write_carry_forget_units:
    text: Writes the carry and forgets the units digit, e.g. 87 + 93 = 11.
    eedi: []

  rule:subtraction.no_column_limit:
    text: Writes each column's whole sum without regrouping, e.g. 47 + 38 = 715.
    eedi: [711]

  rule:buggy_subtraction.borrow_into_1_equals_10:
    text: Borrowing into a 1 gives 10 instead of 11, e.g. 321 - 89 = 231.
    eedi: []

  rule:buggy_subtraction.borrow_writes_10:
    text: Borrowing across a 0 turns it into 10 instead of 9, e.g. 403 - 168 = 245.
    eedi: []

  rule:buggy_subtraction.diff_0_n_equals_0:
    text: Writes 0 whenever the top digit is 0, e.g. 140 - 21 = 120.
    eedi: []

  rule:buggy_subtraction.diff_n_0_equals_0:
    text: Writes 0 whenever the bottom digit is 0, e.g. 403 - 208 = 105.
    eedi: []

  rule:buggy_subtraction.forget_borrow_over_blanks:
    text: Does not borrow over blank columns when the top number is shorter, e.g. 85 - 127 = 158.
    eedi: []

  rule:buggy_subtraction.left_ten_ok:
    text: Changes a 0 to 9 without borrowing further, e.g. 302 - 7 = 395.
    eedi: []

  rule:buggy_subtraction.move_over_zero_borrow:
    text: Skips over a 0 when borrowing, leaving it 0, e.g. 304 - 75 = 139.
    eedi: []

  rule:subtraction.always_borrow_left:
    text: Borrows in every column, needed or not, e.g. 85 - 23 = 52.
    eedi: []

  rule:subtraction.borrow_from_bottom:
    text: Borrows from the bottom number instead of the top, e.g. 52 - 17 = 55.
    eedi: []

  rule:subtraction.borrow_no_decrement:
    text: Adds 10 when borrowing but never takes 1 from the next column, e.g. 52 - 17 = 45.
    eedi: [699]

  rule:subtraction.diff_0_n_equals_n:
    text: Writes the bottom digit whenever the top digit is 0, e.g. 140 - 21 = 121.
    eedi: []

  rule:subtraction.smaller_from_larger:
    text: Takes the smaller digit from the larger in every column, e.g. 62 - 37 = 35.
    eedi: [1795]

  rule:subtraction.stops_borrow_at_zero:
    text: Stops borrowing at a 0 and takes smaller from larger, e.g. 402 - 6 = 404.
    eedi: [1751]

  rule:buggy_multiplication.column_mimics_addition:
    text: Multiplies column by column like adding, e.g. 68 × 46 = 24.
    eedi: [1334]

  rule:multiplication_division.alignment_error_in_multi_digit:
    text: Does not shift partial products by place value, e.g. 23 × 14 = 115.
    eedi: [2476]

  rule:multiplication_division.forget_to_add_carried_number:
    text: Forgets to add the carried digit when multiplying, e.g. 23 × 4 = 82.
    eedi: [1403]

  rule:scientific_notation.add_coefficients_when_multiplying:
    text: Adds the coefficients instead of multiplying them in standard form, e.g. (3 × 10^4) × (2 × 10^5) = 5 × 10^9.
    eedi: []

  rule:scientific_notation.count_all_zeros_for_exponent:
    text: Uses the number of zeros as the exponent, e.g. 45000 = 4.5 × 10^3.
    eedi: [1571]

  rule:scientific_notation.wrong_exponent_sign:
    text: Gives the exponent the wrong sign, e.g. 45000 = 4.5 × 10^-4 and 0.0032 = 3.2 × 10^3.
    eedi: [2099]

  slip:
    text: A careless mistake with no underlying misconception.
    eedi: []
